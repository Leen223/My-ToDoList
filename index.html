<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="todo-container">
        <h1>My To-Do List</h1>
        <form>
            <label class="visually-hidden" for="input-list">Add a new task</label>
            <input id="input-list" type="text" placeholder="Add a new task..." required>
            <button type="submit">Add Task</button>
        </form>
        <section aria-label="Tasks">
            <ul id="todo-list"></ul>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
