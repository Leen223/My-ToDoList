<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="todo-container">
        <h1>My To Do List</h1>

        <h2>Add New Task</h2>
        <form id="single-form" class="inline-form">
            <input id="input-list" type="text" placeholder="Enter your task..." required>
            <button type="submit">Add Task</button>
        </form>

        <h2>Add Tasks in Bulk</h2>
        <form id="bulk-form" class="inline-form">
            <textarea id="bulk-input" placeholder="Enter each task on a new line..."></textarea>
            <button type="submit">Add All Tasks</button>
        </form>

        <h2>My Tasks</h2>
        <ul id="todo-list"></ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
